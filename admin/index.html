<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OptiApp Verwaltung</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="../website/img/icon.svg">
<style>
@font-face{font-family:"Atkinson";src:url(../website/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson";src:url(../website/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Bricolage";src:url(../website/fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
:root{
  --paper:#F2F6F5; --surface:#FFFFFF; --surface-2:#E9F0EE; --ink:#172235; --muted:#566273; --line:#D5DEDC; --grid:#E3EAE8;
  --lens:#0E6B75; --lens-ink:#fff; --series:#008C99; --amber:#9A6412;
  --ok:#1E7B4F; --ok-bg:#E2F3EA; --warn:#8A5A00; --warn-bg:#FBEFD6; --mute-bg:#E8ECEF;
  --display:"Bricolage",system-ui,sans-serif; --text:"Atkinson",system-ui,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1726;--surface:#16213A;--surface-2:#1C2944;--ink:#E7EEF0;--muted:#9FB0BE;--line:#2A3A55;--grid:#223150;
  --lens:#4FBFC8;--lens-ink:#0F1726;--series:#22A3AF;--amber:#E6B15E;--ok:#6FD3A0;--ok-bg:#163A2C;--warn:#F0C065;--warn-bg:#3A2F14;--mute-bg:#243049;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0F1726;--surface:#16213A;--surface-2:#1C2944;--ink:#E7EEF0;--muted:#9FB0BE;--line:#2A3A55;--grid:#223150;--lens:#4FBFC8;--lens-ink:#0F1726;--series:#22A3AF;--amber:#E6B15E;--ok:#6FD3A0;--ok-bg:#163A2C;--warn:#F0C065;--warn-bg:#3A2F14;--mute-bg:#243049;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--text)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lens);outline-offset:2px;border-radius:6px}
h1,h2{font-family:var(--display);margin:0;line-height:1.15}
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in,.main{max-width:1240px;margin:0 auto;padding:0 24px}
.top-in{display:flex;align-items:center;gap:14px;height:66px}
.logo-ph{display:grid;place-items:center;width:36px;height:36px;border:2px dashed var(--muted);border-radius:11px;font:700 9px/1 var(--text);color:var(--muted)}
.word{font:750 21px/1 var(--display);letter-spacing:-.02em}
.logo{display:block;width:auto;color:var(--ink)}
.tag{font-size:13px;color:var(--muted);border-left:1px solid var(--line);padding-left:14px}
.grow{flex:1}
.btn{border:2px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.btn:hover{border-color:var(--ink)}
.main{padding-top:28px;padding-bottom:60px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h1{font-size:34px;font-weight:760;letter-spacing:-.02em}
.head p{margin:6px 0 0;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.flabel{font-size:14px;color:var(--muted);margin-right:-2px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tile .l{font-size:14px;color:var(--muted)}
.tile .n{font:760 34px/1.1 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .s{font-size:13.5px;color:var(--muted);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;position:relative}
.card h2{font-size:19px;font-weight:700}
.card .sub{font-size:14px;color:var(--muted);margin-top:2px}
.chart{position:relative;margin-top:12px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.axis text{fill:var(--muted);font-size:12px;font-family:var(--text)}
.gridline{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;z-index:5;pointer-events:none;background:var(--ink);color:var(--paper);padding:7px 10px;border-radius:9px;font-size:13px;line-height:1.35;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
.tip.on{opacity:1}
.tip b{font-weight:700}
.tblwrap{overflow-x:auto;margin-top:12px}
table{width:100%;border-collapse:collapse;min-width:820px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:middle}
th{font-size:13px;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr{cursor:pointer}
tbody tr:hover td,tbody tr[aria-selected="true"] td{background:var(--surface-2)}
.name b{display:block}.name span{font-size:13.5px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-mute{background:var(--mute-bg);color:var(--muted)}.b-pilot{background:var(--surface-2);color:var(--lens);border:1px solid var(--lens)}
.demo{font-size:11.5px;font-weight:700;color:var(--muted);border:1px dashed var(--muted);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.bar-in{height:8px;border-radius:4px;background:var(--series);min-width:2px}
.minibar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.minibar .track{width:70px;height:8px;border-radius:4px;background:var(--grid);overflow:hidden}
.detail{margin-top:14px}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kv{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.kv span{display:block;font-size:13px;color:var(--muted)}.kv b{font:700 20px/1.2 var(--display);font-variant-numeric:tabular-nums}
.dcols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-top:16px}
.stores{list-style:none;padding:0;margin:8px 0 0}
.stores li{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.note{font-size:13px;color:var(--muted);margin-top:18px}.note a{color:var(--lens);font-weight:700}
.nav{display:flex;gap:4px;margin-left:6px}
.nav button{border:0;background:transparent;border-radius:999px;padding:8px 14px;font-weight:700;font-size:15px;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.btn.pri{background:var(--lens);border-color:var(--lens);color:var(--lens-ink)}
.btn.pri:hover{filter:brightness(1.08);border-color:var(--lens)}
.btn.sm{padding:5px 12px;font-size:14px;border-width:1.5px}
.btn:disabled{opacity:.45;cursor:default}
.money{width:92px;text-align:right;font:inherit;font-variant-numeric:tabular-nums;padding:6px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.money:focus{border-color:var(--lens);outline:none}
.sel{font:inherit;font-weight:700;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.inv tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;padding-top:12px}
.inv tbody tr{cursor:default}.inv tbody tr:hover td{background:transparent}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
.strike td{color:var(--muted)}.strike td.amt{text-decoration:line-through}
.flash{margin-top:14px;padding:12px 16px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:700}
.flash.warn{background:var(--warn-bg);color:var(--warn)}
/* Rechnung (Modal + Druck) */
.modal{position:fixed;inset:0;background:rgba(10,16,28,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow:auto;z-index:50}
.modal[hidden]{display:none}
.mbar{position:sticky;top:0;display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
.mbar .btn{background:var(--surface)}
.mwrap{width:100%;max-width:820px}
.paper{background:#fff;color:#172235;border-radius:6px;padding:48px 52px;font:400 14.5px/1.5 var(--text);box-shadow:0 10px 40px rgba(0,0,0,.25)}
.paper tr:hover td,.paper tbody tr:hover td{background:none!important}.paper tr{cursor:default}
.ff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin-top:14px}.ff label{display:block;font-size:13.5px;font-weight:700;color:var(--muted);margin-bottom:4px}.ff .wide{grid-column:1/-1}
.txt{width:100%;font:inherit;padding:8px 10px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}.txt:focus{border-color:var(--lens);outline:none}.txt.miss{background:var(--warn-bg);border-color:#E9C46A}
.saved{font-size:13px;color:var(--ok);font-weight:700;margin-left:8px;opacity:0;transition:opacity .2s}.saved.on{opacity:1}
@media (max-width:640px){.ff{grid-template-columns:1fr}}
.paper h1{font:760 30px/1 var(--display);letter-spacing:-.02em;margin:0}
.paper .ph{background:#FFF1A8;padding:0 3px;border-radius:3px}
.p-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.p-from{font-size:12.5px;color:#566273;text-align:right}
.p-addr{margin-top:34px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
.p-meta{border-collapse:collapse;min-width:0;width:auto}.p-meta td{border:0;padding:1px 0 1px 18px;font-size:14px}.p-meta td:first-child{color:#566273;padding-left:0}
.p-lines{margin-top:30px;min-width:0}.p-lines th{color:#566273;border-bottom:1.5px solid #172235}.p-lines td,.p-lines th{font-size:14px;padding:9px 6px}
.p-sum{margin:12px 0 0 auto;border-collapse:collapse;min-width:0;width:300px}.p-sum td{border:0;padding:4px 6px;font-size:14px}.p-sum tr.tot td{border-top:1.5px solid #172235;font-weight:700;font-size:16px;padding-top:8px}
.p-foot{margin-top:36px;font-size:12.5px;color:#566273;border-top:1px solid #D5DEDC;padding-top:14px}
.storno{display:inline-block;margin-top:10px;border:2px solid #B3261E;color:#B3261E;font-weight:700;padding:2px 10px;border-radius:6px;letter-spacing:.06em}
@media print{body>*:not(.modal){display:none!important}.modal{position:static;background:none;padding:0;display:block}.mbar{display:none}.mwrap{max-width:none}.paper{box-shadow:none;border-radius:0;padding:0}.paper .ph{background:none}@page{margin:18mm}}
@media (max-width:560px){.paper{padding:26px 20px}.top-in{flex-wrap:wrap;height:auto;padding-top:12px;padding-bottom:8px;row-gap:6px}.nav{order:3;width:100%;margin-left:-8px}.nav button{padding:8px 12px}}
.logo{flex:none}
.close{position:absolute;right:14px;top:14px;border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px}
.empty{color:var(--muted);padding:20px 0}
@media (max-width:1000px){.grid2,.dcols{grid-template-columns:1fr}.tiles,.dgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.top-in,.main{padding:0 16px}.main{padding-top:20px}.tag{display:none}.head h1{font-size:28px}.tile .n{font-size:28px}}
</style>
</head>

<script>
/* OptiApp-Verwaltung (Prototyp). Optik Falkner = Live-Daten aus dem Prototyp im selben Browser; alle anderen Optiker sind erfundene Demo-Daten. */
try{if(sessionStorage.getItem('optiapp-admin')!=='1'){location.replace('../website/login.html');}}catch(e){}
function logout(){try{sessionStorage.removeItem('optiapp-admin')}catch(e){}location.href='../website/login.html'}

const NOW=new Date(), MONTHS=[]; // letzte 12 Monate inkl. aktuellem
for(let i=11;i>=0;i--){const d=new Date(NOW.getFullYear(),NOW.getMonth()-i,1);MONTHS.push(d)}
const mLabel=d=>d.toLocaleDateString('de-AT',{month:'short'}).replace('.','');
const mLong=d=>d.toLocaleDateString('de-AT',{month:'long',year:'numeric'});
const nf=n=>n.toLocaleString('de-AT');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const appUsers=S&&S.profile?1+((S.family||[]).length):2; // ohne App-Daten im Browser: Demo-Konto Julian + Lena

/* ---------- Diagramme (SVG, mit Tooltip) ---------- */
const NS='http://www.w3.org/2000/svg';
function niceMax(v){if(v<=0)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
function ticks(max){const step=max/4;return [0,1,2,3,4].map(i=>Math.round(i*step))}
function placeTip(t,x,y){t.style.top=y;t.classList.add('on');const host=t.parentNode,w=t.offsetWidth,hw=host.clientWidth,cx=parseFloat(x);t.style.left=Math.max(w/2,Math.min(hw-w/2,cx))+'px'}
function mkTip(host){const t=document.createElement('div');t.className='tip';host.appendChild(t);return t}
function lineChart(id,labels,vals,long,unit){
  const host=document.getElementById(id), W=620,H=250,L=48,R=14,T=14,B=30, max=niceMax(Math.max(...vals)), x=i=>L+(labels.length===1?0:i*(W-L-R)/(labels.length-1)), y=v=>T+(H-T-B)*(1-v/max);
  let g='';ticks(max).forEach(v=>{g+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`});
  labels.forEach((l,i)=>{if(labels.length<=6||i%2===(labels.length-1)%2)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${l}</text>`});
  const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Liniendiagramm: registrierte Endkunden, zuletzt ${nf(vals[vals.length-1])}"><g class="axis">${g}</g>
    <path d="${d}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${x(vals.length-1)}" cy="${y(vals[vals.length-1])}" r="4.5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>
    <text x="${x(vals.length-1)-8}" y="${y(vals[vals.length-1])-10}" text-anchor="end" style="font:700 13px var(--text);fill:var(--ink)">${nf(vals[vals.length-1])}</text>
    <line id="${id}X" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3" opacity="0"/><circle id="${id}D" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2" opacity="0"/>
    <rect x="${L}" y="${T}" width="${W-L-R}" height="${H-T-B}" fill="transparent" id="${id}H"/></svg>`;
  const tip=mkTip(host), svg=host.querySelector('svg'), hit=document.getElementById(id+'H'), X=document.getElementById(id+'X'), D=document.getElementById(id+'D');
  const move=e=>{const r=svg.getBoundingClientRect(),k=W/r.width,px=(e.clientX-r.left)*k;let i=Math.round((px-L)/((W-L-R)/Math.max(1,labels.length-1)));i=Math.max(0,Math.min(labels.length-1,i));
    X.setAttribute('x1',x(i));X.setAttribute('x2',x(i));X.setAttribute('opacity',1);D.setAttribute('cx',x(i));D.setAttribute('cy',y(vals[i]));D.setAttribute('opacity',1);
    const prev=i?vals[i]-vals[i-1]:null;tip.innerHTML=`${long[i]}<br><b>${nf(vals[i])} ${unit}</b>${prev!==null?` · ${prev>=0?'+':''}${nf(prev)}`:''}`;placeTip(tip,(x(i)/k)+'px',(y(vals[i])/k)+'px')};
  hit.addEventListener('pointermove',move);hit.addEventListener('pointerdown',move);hit.addEventListener('pointerleave',()=>{tip.classList.remove('on');X.setAttribute('opacity',0);D.setAttribute('opacity',0)});
}
function barChart(id,names,vals,ids){
  const host=document.getElementById(id); if(!vals.length){host.innerHTML='<p class="empty">Keine Daten</p>';return}
  const W=440,rowH=34,L=0,T=4,H=T+names.length*rowH+4, max=Math.max(1,...vals), lw=190, bw=W-lw-56;
  let s='';names.forEach((n,i)=>{const yy=T+i*rowH, w=Math.max(vals[i]?4:0,vals[i]/max*bw);
    s+=`<g class="bar" data-i="${i}" style="cursor:pointer" onclick="pick('${ids[i]}')"><rect x="0" y="${yy}" width="${W}" height="${rowH}" fill="transparent"/>
      <text x="0" y="${yy+21}" style="font:400 14px var(--text);fill:var(--ink)">${esc(n.length>24?n.slice(0,23)+'…':n)}</text>
      ${w?`<rect x="${lw}" y="${yy+10}" width="${w}" height="14" rx="4" fill="var(--series)"/>`:`<line x1="${lw}" x2="${lw}" y1="${yy+8}" y2="${yy+26}" stroke="var(--line)" stroke-width="2"/>`}
      <text x="${lw+w+8}" y="${yy+21}" style="font:700 13px var(--text);fill:var(--ink)">${nf(vals[i])}</text></g>`});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Balkendiagramm: Endkunden je Optiker">${s}</svg>`;
  const tip=mkTip(host), svg=host.querySelector('svg'), tot=vals.reduce((a,b)=>a+b,0);
  host.querySelectorAll('.bar').forEach(g=>{const i=+g.dataset.i;g.addEventListener('pointerenter',()=>{const r=svg.getBoundingClientRect(),k=W/r.width;tip.innerHTML=`${esc(names[i])}<br><b>${nf(vals[i])} Endkunden</b> · ${tot?Math.round(vals[i]/tot*100):0} %`;placeTip(tip,((lw+bw/2)/k)+'px',((T+i*rowH+8)/k)+'px')});g.addEventListener('pointerleave',()=>tip.classList.remove('on'))});
}
function colChart(id,labels,vals,long){
  const host=document.getElementById(id), W=560,H=210,L=40,R=8,T=10,B=28,max=niceMax(Math.max(...vals,1)),n=labels.length,slot=(W-L-R)/n,bw=Math.min(30,slot-6),y=v=>T+(H-T-B)*(1-v/max);
  let s='';ticks(max).forEach(v=>{s+=`<line class="gridline" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`});
  labels.forEach((l,i)=>{const cx=L+slot*i+slot/2;if(n<=6||i%2===(n-1)%2)s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${l}</text>`});
  let bars='';vals.forEach((v,i)=>{const cx=L+slot*i+slot/2,h=(H-T-B)-(y(v)-T);bars+=`<g class="col" data-i="${i}"><rect x="${cx-slot/2}" y="${T}" width="${slot}" height="${H-T-B}" fill="transparent"/>${v?`<path d="M${cx-bw/2} ${H-B} V${y(v)+4} q0 -4 4 -4 H${cx+bw/2-4} q4 0 4 4 V${H-B} Z" fill="var(--series)"/>`:''}</g>`});
  host.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Säulendiagramm: neue Registrierungen pro Monat"><g class="axis">${s}</g>${bars}<line x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}" stroke="var(--line)"/></svg>`;
  const tip=mkTip(host),svg=host.querySelector('svg');
  host.querySelectorAll('.col').forEach(g=>{const i=+g.dataset.i;g.addEventListener('pointerenter',()=>{const r=svg.getBoundingClientRect(),k=W/r.width;tip.innerHTML=`${long[i]}<br><b>${nf(vals[i])} neue Endkunden</b>`;placeTip(tip,((L+slot*i+slot/2)/k)+'px',(y(vals[i])/k)+'px')});g.addEventListener('pointerleave',()=>tip.classList.remove('on'))});
}

/* Abrechnung monatlich: Grundgebühr je Filiale + Gebühr je registriertem Endkunden (Bestand am Monatsende). Beträge netto, zzgl. 20 % USt.
   Prototyp: Tarife und Rechnungen liegen im Browser (localStorage). */
const BKEY='optiapp-billing-v1', VAT=.2;
let B={tariffs:{},invoices:[],seq:{},company:{},addr:{}}, view='optiker', per=10, flash=null;
try{const x=JSON.parse(localStorage.getItem(BKEY));if(x&&x.tariffs)B=Object.assign(B,x)}catch(e){}
const CO_FIELDS=[['name','Firmenname','OptiApp GmbH'],['suffix','Zusatz (z. B. in Gründung)','in Gründung'],['street','Straße und Hausnummer',''],['city','PLZ und Ort',''],['country','Land','Österreich'],['email','E-Mail','office@optiapp.at'],['web','Website','optiapp.at'],['uid','UID-Nummer',''],['fn','Firmenbuchnummer',''],['court','Firmenbuchgericht',''],['bank','Bank',''],['iban','IBAN',''],['bic','BIC',''],['due','Zahlungsziel in Tagen','14']];
const CO_REQ=['street','city','uid','iban','bic','fn'];
const co=k=>{const v=B.company[k];if(v!==undefined)return v;const f=CO_FIELDS.find(x=>x[0]===k);return f?f[2]:''};
const adr=id=>B.addr[id]||{street:'',city:'',uid:''};
const ph=(v,label)=>v?esc(v):`<span class="ph">${esc(label)}</span>`;
function saveB(){try{localStorage.setItem(BKEY,JSON.stringify(B))}catch(e){}}
const eur=n=>n.toLocaleString('de-AT',{style:'currency',currency:'EUR'});
const eur4=n=>n.toLocaleString('de-AT',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:4});
const r2=n=>Math.round(n*100)/100;
const fmtIn=n=>n?n.toLocaleString('de-AT',{minimumFractionDigits:2,maximumFractionDigits:4,useGrouping:false}):'';
const tariff=id=>B.tariffs[id]||{store:0,cust:0};
const periodKey=i=>{const d=MONTHS[i];return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const monthEnd=i=>new Date(MONTHS[i].getFullYear(),MONTHS[i].getMonth()+1,0);
const fmtD=d=>new Date(d).toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});
const custAt=(o,i)=>o.reg.slice(0,i+1).reduce((a,b)=>a+b,0);
const startIdx=o=>11+o.since;
function parseMoney(v){v=String(v).trim().replace(/\s|€/g,'');if(v.indexOf(',')>-1)v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)&&n>=0?Math.round(n*10000)/10000:0}
function setTariff(id,k,el){const t=Object.assign({},tariff(id));t[k]=parseMoney(el.value);B.tariffs[id]=t;saveB();el.value=fmtIn(t[k]);setTimeout(()=>renderInv(true),0)}
function invFor(id,pk){return B.invoices.find(v=>v.opt===id&&v.period===pk&&!v.storno)}
// Prüft, ob für Optiker o im Monat i eine Rechnung erstellt werden kann
function billable(o,i){
  const t=tariff(o.id);
  if(o.status==='setup')return 'App noch nicht live';
  if(i<startIdx(o))return 'Start erst '+mLong(MONTHS[Math.min(11,startIdx(o))]);
  if(!t.store&&!t.cust)return 'Kein Tarif hinterlegt';
  if(invFor(o.id,periodKey(i)))return 'Bereits erstellt';
  return '';
}
function calc(o,i){const t=tariff(o.id),stores=o.stores.length,cust=custAt(o,i);
  const lines=[{txt:'Grundgebühr OptiApp je Filiale',sub:o.stores.map(s=>s[0]).join(', '),qty:stores,unit:t.store},{txt:'Registrierte Endkunden',sub:'Stand '+fmtD(monthEnd(i)),qty:cust,unit:t.cust}].filter(l=>l.unit>0);
  lines.forEach(l=>l.sum=r2(l.qty*l.unit));const net=r2(lines.reduce((a,l)=>a+l.sum,0)),vat=r2(net*VAT);return {lines,net,vat,gross:r2(net+vat),stores,cust}}
function createInv(id,silent){
  const o=OPT.find(x=>x.id===id),why=billable(o,per); if(why){if(!silent){flash=['warn',o.name+': '+why];renderInv()}return null}
  const y=MONTHS[per].getFullYear(); B.seq[y]=(B.seq[y]||0)+1;
  const c=calc(o,per), inv={nr:'OA-'+y+'-'+String(B.seq[y]).padStart(4,'0'),date:new Date().toISOString(),opt:id,optName:o.name,period:periodKey(per),periodTxt:mLong(MONTHS[per]),
    due:new Date(Date.now()+(parseInt(co('due'))||14)*864e5).toISOString(),from:Object.fromEntries(CO_FIELDS.map(f=>[f[0],co(f[0])])),to:Object.assign({},adr(id)),lines:c.lines,net:c.net,vat:c.vat,gross:c.gross,demo:!o.live};
  B.invoices.unshift(inv);saveB();
  if(!silent){flash=['ok','Rechnung '+inv.nr+' für '+o.name+' erstellt.'];renderInv();openInv(inv.nr)}
  return inv;
}
function createAll(){
  const made=[],skip=[];OPT.forEach(o=>{const why=billable(o,per);if(why){if(why==='Kein Tarif hinterlegt')skip.push(o.name+' ('+why+')');return}made.push(createInv(o.id,true))});
  flash=made.length?['ok',made.length+' Rechnung'+(made.length>1?'en':'')+' für '+mLong(MONTHS[per])+' erstellt'+(skip.length?'. Übersprungen: '+skip.join(', '):'')+'.']
    :['warn','Keine neue Rechnung erstellt'+(skip.length?'. '+skip.join(', '):'')+'.'];
  renderInv();
}
function stornoInv(nr){const v=B.invoices.find(x=>x.nr===nr);if(!v||v.storno)return;if(!confirmStorno(nr))return;v.storno=new Date().toISOString();saveB();flash=['ok','Rechnung '+nr+' storniert. Für '+v.optName+' kann jetzt eine neue Rechnung erstellt werden.'];renderInv()}
let stornoArm=null;function confirmStorno(nr){if(stornoArm===nr){stornoArm=null;return true}stornoArm=nr;renderInv(true);return false}
function invHTML(v){
  const F=v.from||Object.fromEntries(CO_FIELDS.map(f=>[f[0],co(f[0])])), T=v.to||adr(v.opt), g=k=>F[k]||'';
  return `<div class="paper"><div class="p-top"><div>${LOGO_SVG}</div><div class="p-from"><b style="color:#172235">${ph(g('name'),'Firmenname')}</b>${g('suffix')?' ('+esc(g('suffix'))+')':''}<br>${ph(g('street'),'Straße Hausnummer')}<br>${ph(g('city'),'PLZ Ort')}${g('country')?', '+esc(g('country')):''}<br>${[g('email'),g('web')].filter(Boolean).map(esc).join(' · ')}<br>UID: ${ph(g('uid'),'ATU________')}</div></div>
  <div class="p-addr"><div><div style="font-size:12px;color:#566273">Rechnung an</div><b>${esc(v.optName)}</b>${v.demo?' <span class="ph">Demo</span>':''}<br>${ph(T.street,'Rechnungsadresse')}<br>${ph(T.city,'PLZ Ort')}${T.uid?'<br>UID: '+esc(T.uid):''}</div>
    <table class="p-meta"><tr><td>Rechnungsnummer</td><td><b>${v.nr}</b></td></tr><tr><td>Rechnungsdatum</td><td>${fmtD(v.date)}</td></tr><tr><td>Leistungszeitraum</td><td>${v.periodTxt}</td></tr><tr><td>Fällig am</td><td>${fmtD(v.due)}</td></tr></table></div>
  <h1 style="margin-top:34px">Rechnung</h1>${v.storno?`<div class="storno">STORNIERT am ${fmtD(v.storno)}</div>`:''}
  <table class="p-lines"><thead><tr><th>Leistung</th><th class="num">Menge</th><th class="num">Einzelpreis</th><th class="num">Betrag</th></tr></thead><tbody>
    ${v.lines.map(l=>`<tr><td>${esc(l.txt)}<div style="font-size:12.5px;color:#566273">${esc(l.sub)}</div></td><td class="num">${nf(l.qty)}</td><td class="num">${eur4(l.unit)}</td><td class="num">${eur(l.sum)}</td></tr>`).join('')}</tbody></table>
  <table class="p-sum"><tr><td>Summe netto</td><td class="num">${eur(v.net)}</td></tr><tr><td>zzgl. 20 % USt.</td><td class="num">${eur(v.vat)}</td></tr><tr class="tot"><td>Gesamtbetrag</td><td class="num">${eur(v.gross)}</td></tr></table>
  <div class="p-foot">Bitte überweisen Sie den Betrag bis ${fmtD(v.due)} unter Angabe der Rechnungsnummer ${v.nr}.<br>${g('bank')?esc(g('bank'))+' · ':''}IBAN: ${ph(g('iban'),'AT__ ____ ____ ____ ____')} · BIC: ${ph(g('bic'),'________')}<br>Firmenbuch: ${ph(g('fn'),'FN ______')}${g('court')?', '+esc(g('court')):''}</div></div>`;
}
/* ---------- Firmendaten (Absender) und Rechnungsadressen ---------- */
let savedT=null;
function flashSaved(){const el=document.getElementById('savedMsg');if(!el)return;el.classList.add('on');clearTimeout(savedT);savedT=setTimeout(()=>el.classList.remove('on'),1400)}
function setCo(k,el){B.company[k]=el.value.trim();if(k==='iban')B.company[k]=B.company[k].toUpperCase().replace(/\s+/g,'').replace(/(.{4})/g,'$1 ').trim();el.value=B.company[k];el.classList.toggle('miss',CO_REQ.includes(k)&&!B.company[k]);saveB();flashSaved();missInfo()}
function setAdr(id,k,el){const a=Object.assign({},adr(id));a[k]=el.value.trim();B.addr[id]=a;el.value=a[k];el.classList.toggle('miss',k!=='uid'&&!a[k]);saveB();flashSaved();missInfo()}
function missCount(){return CO_REQ.filter(k=>!co(k)).length+OPT.filter(o=>o.status!=='setup').reduce((n,o)=>n+(!adr(o.id).street?1:0)+(!adr(o.id).city?1:0),0)}
function missInfo(){const el=document.getElementById('missInfo');if(el){const n=missCount();el.textContent=n?n+' gelbe Feld'+(n>1?'er':'')+' noch offen':'Alle Pflichtfelder ausgefüllt'}}
function renderFirma(){
  const fld=([k,l,d])=>`<div class="${k==='name'||k==='street'?'wide':''}"><label for="co-${k}">${l}${CO_REQ.includes(k)?' *':''}</label><input class="txt ${CO_REQ.includes(k)&&!co(k)?'miss':''}" id="co-${k}" value="${esc(co(k))}" placeholder="${esc(d||'')}" ${k==='due'?'inputmode="numeric"':''} ${k==='email'?'type="email"':''} onchange="setCo('${k}',this)"></div>`;
  document.getElementById('app').innerHTML=`
  <div class="head"><div class="grow"><h1>Firmendaten</h1><p>Diese Angaben erscheinen auf allen neuen Rechnungen. Gelb markierte Felder sind noch leer. Änderungen werden sofort gespeichert.</p></div>
    <div class="hint" style="font-weight:700"><span id="missInfo"></span><span class="saved" id="savedMsg">✓ Gespeichert</span></div></div>
  <div class="card" style="margin-top:18px"><h2>Unsere Firma (Absender)</h2><div class="sub">Kopf und Fußzeile der Rechnung</div>
    <div class="ff">${CO_FIELDS.map(fld).join('')}</div></div>
  <div class="card" style="margin-top:14px"><h2>Rechnungsadressen der Optiker</h2><div class="sub">Empfänger auf der Rechnung. UID nur, wenn der Optiker eine hat.</div>
    <div class="tblwrap"><table class="inv"><thead><tr><th>Optiker</th><th>Straße und Hausnummer *</th><th>PLZ und Ort *</th><th>UID-Nummer</th></tr></thead><tbody>
    ${OPT.map(o=>{const a=adr(o.id),need=o.status!=='setup';return `<tr><td class="name"><b>${esc(o.name)}${o.live?'':'<span class="demo">Demo</span>'}</b><span>${badge(o.status)}</span></td>
      <td><input class="txt ${need&&!a.street?'miss':''}" aria-label="Straße ${esc(o.name)}" value="${esc(a.street)}" onchange="setAdr('${o.id}','street',this)"></td>
      <td><input class="txt ${need&&!a.city?'miss':''}" aria-label="PLZ und Ort ${esc(o.name)}" value="${esc(a.city)}" onchange="setAdr('${o.id}','city',this)"></td>
      <td><input class="txt" aria-label="UID ${esc(o.name)}" value="${esc(a.uid)}" placeholder="ATU…" onchange="setAdr('${o.id}','uid',this)"></td></tr>`}).join('')}
    </tbody></table></div>
    <p class="note">Bereits erstellte Rechnungen behalten die Angaben vom Zeitpunkt der Erstellung. Für geänderte Daten die Rechnung stornieren und neu erstellen.</p></div>`;
  missInfo();
}
function openInv(nr){const v=B.invoices.find(x=>x.nr===nr);if(!v)return;document.getElementById('invDoc').innerHTML=invHTML(v);const m=document.getElementById('modal');m.hidden=false;document.title=v.nr+' – OptiApp';m.querySelector('.mbar .btn').focus()}
function closeInv(){document.getElementById('modal').hidden=true;document.title='OptiApp Verwaltung'}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('modal').hidden)closeInv()});

function renderInv(keepFocus){
  const fid=keepFocus&&document.activeElement&&document.activeElement.id;
  const pk=periodKey(per), rows=OPT.map(o=>({o,c:calc(o,per),why:billable(o,per),inv:invFor(o.id,pk)}));
  const open=rows.filter(r=>!r.why), sumOpen=r2(open.reduce((a,r)=>a+r.c.net,0));
  const monthsOpts=MONTHS.slice(0,11).map((d,i)=>`<option value="${i}" ${i===per?'selected':''}>${mLong(d)}${i===10?' (Vormonat)':''}</option>`).reverse().join('');
  const invs=B.invoices;
  document.getElementById('app').innerHTML=`
  <div class="head"><div class="grow"><h1>Rechnungen</h1><p>Monatliche Abrechnung je Filiale und je registriertem Endkunden. Alle Beträge netto, zzgl. 20 % USt.</p></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="flabel" for="perSel">Abrechnungsmonat</label><select class="sel" id="perSel" onchange="per=+this.value;flash=null;renderInv()">${monthsOpts}</select>
    <button class="btn pri" id="allBtn" onclick="createAll()" ${open.length?'':'disabled'}>Alle Rechnungen erstellen${open.length?' ('+open.length+')':''}</button></div></div>
  ${flash?`<div class="flash ${flash[0]==='warn'?'warn':''}" role="status">${esc(flash[1])}</div>`:''}
  <div class="card" style="margin-top:18px"><h2>Tarife und Abrechnung ${esc(mLong(MONTHS[per]))}</h2><div class="sub">Standardtarif je Optiker eintragen. Er wird bei „Rechnung erstellen“ übernommen. Offen: ${open.length} Rechnung${open.length===1?'':'en'} · ${eur(sumOpen)} netto</div>
    <div class="tblwrap"><table class="inv"><thead><tr><th>Optiker</th><th class="num">Filialen</th><th class="num">Endkunden<br>am Monatsende</th><th class="num">€ je Filiale<br>und Monat</th><th class="num">€ je Endkunde<br>und Monat</th><th class="num">Betrag netto</th><th class="num">Rechnung</th></tr></thead><tbody>
    ${rows.map(({o,c,why,inv})=>{const t=tariff(o.id);return `<tr><td class="name"><b>${esc(o.name)}${o.live?'':'<span class="demo">Demo</span>'}</b><span>${badge(o.status)}</span></td>
      <td class="num">${c.stores}</td><td class="num">${nf(c.cust)}</td>
      <td class="num"><input class="money" id="ts-${o.id}" inputmode="decimal" aria-label="Tarif je Filiale ${esc(o.name)}" placeholder="0,00" value="${fmtIn(t.store)}" onchange="setTariff('${o.id}','store',this)"></td>
      <td class="num"><input class="money" id="tc-${o.id}" inputmode="decimal" aria-label="Tarif je Endkunde ${esc(o.name)}" placeholder="0,00" value="${fmtIn(t.cust)}" onchange="setTariff('${o.id}','cust',this)"></td>
      <td class="num">${inv?eur(inv.net):(t.store||t.cust)&&!why?eur(c.net):'–'}</td>
      <td class="num">${inv?`<button class="btn sm" id="ac-${o.id}" onclick="openInv('${inv.nr}')">${inv.nr} ansehen</button>`:why?`<span class="hint">${why}</span>`:`<button class="btn sm pri" id="ac-${o.id}" onclick="createInv('${o.id}')">Rechnung erstellen</button>`}</td></tr>`}).join('')}
    </tbody><tfoot><tr><td>Gesamt (${rows.length} Optiker)</td><td class="num">${nf(rows.reduce((a,r)=>a+r.c.stores,0))}</td><td class="num">${nf(rows.reduce((a,r)=>a+r.c.cust,0))}</td><td></td><td></td>
      <td class="num">${eur(r2(rows.reduce((a,r)=>a+(r.inv?r.inv.net:(!r.why?r.c.net:0)),0)))}</td><td class="num hint" style="font-weight:400">${rows.filter(r=>r.inv).length} erstellt · ${open.length} offen</td></tr></tfoot></table></div>
    <p class="note">Endkunden = alle registrierten Endkunden am Ende des Monats. Optiker in Einrichtung werden erst ab Start der App verrechnet. Optik Falkner rechnet mit den Live-Daten des Prototyps.</p></div>
  <div class="card" style="margin-top:14px"><h2>Erstellte Rechnungen</h2><div class="sub">${invs.length?invs.length+' Rechnung'+(invs.length>1?'en':'')+', neueste zuerst':'Noch keine Rechnungen erstellt.'}</div>
    ${invs.length?`<div class="tblwrap"><table class="inv"><thead><tr><th>Nummer</th><th>Datum</th><th>Optiker</th><th>Zeitraum</th><th class="num">Netto</th><th class="num">Brutto</th><th>Status</th><th class="num"></th></tr></thead><tbody>
    ${invs.map(v=>`<tr class="${v.storno?'strike':''}"><td><b>${v.nr}</b></td><td>${fmtD(v.date)}</td><td>${esc(v.optName)}</td><td>${v.periodTxt}</td><td class="num amt">${eur(v.net)}</td><td class="num amt">${eur(v.gross)}</td>
      <td>${v.storno?'<span class="badge b-mute">Storniert</span>':'<span class="badge b-ok">Erstellt</span>'}</td>
      <td class="num"><div class="acts"><button class="btn sm" onclick="openInv('${v.nr}')">Ansehen / PDF</button>${v.storno?'':`<button class="btn sm" onclick="stornoInv('${v.nr}')">${stornoArm===v.nr?'Wirklich stornieren?':'Stornieren'}</button>`}</div></td></tr>`).join('')}
    </tbody><tfoot>${(()=>{const ok=invs.filter(v=>!v.storno),st=invs.length-ok.length;return `<tr><td colspan="4">Gesamt (${ok.length} Rechnung${ok.length===1?'':'en'}${st?', ohne '+st+' storniert'+(st>1?'e':'e'):''})</td><td class="num">${eur(r2(ok.reduce((a,v)=>a+v.net,0)))}</td><td class="num">${eur(r2(ok.reduce((a,v)=>a+v.gross,0)))}</td><td colspan="2"></td></tr>`})()}</tfoot></table></div>`:''}
    <p class="note">${missCount()?`Noch ${missCount()} Angaben offen (Absender, Bankdaten, Rechnungsadressen). Bitte unter <a href="#firma" onclick="go('firma');return false">Firmendaten</a> ausfüllen, sonst erscheinen sie gelb auf der Rechnung.`:'Firmendaten und Rechnungsadressen sind vollständig.'}</p></div>`;
  if(fid){const el=document.getElementById(fid);if(el)el.focus()}
}
function go(v){view=v;flash=null;stornoArm=null;try{history.replaceState(null,'',v==='optiker'?location.pathname:'#'+v)}catch(e){}renderAll();window.scrollTo(0,0)}
function renderAll(){document.querySelectorAll('.nav button').forEach(b=>{if(b.dataset.v===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(view==='rechnungen')renderInv();else if(view==='firma')renderFirma();else render()}
if(location.hash==='#rechnungen')view='rechnungen';if(location.hash==='#firma')view='firma';
const LOGO_SVG=(()=>{const l=document.querySelector('header .logo').cloneNode(true);l.setAttribute('height','34');l.style.color='#172235';return l.outerHTML})();
load();renderAll();
window.addEventListener('storage',e=>{if(e.key==='falkner-v10'||e.key==='falkner-dash-v1'){load();renderAll()}});
</script>
</body>
</html>
