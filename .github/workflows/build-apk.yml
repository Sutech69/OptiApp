name: Android APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: |
          [ -d android ] || npx cap add android
          npm run android:icons
          npx cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/debug/app-debug.apk optik-falkner.apk

      - name: APK prüfen (Signatur & Mindest-Android)
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging optik-falkner.apk | grep -E "^package|sdkVersion|application-label:"
          "$BT/apksigner" verify --print-certs optik-falkner.apk | head -3
          ls -la optik-falkner.apk

      - name: APK als Release veröffentlichen (direkter Download-Link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest optik-falkner.apk \
            --title "Optik Falkner – neueste Test-APK" \
            --notes "Automatisch gebaut aus Commit ${GITHUB_SHA::7}. Direkt am Handy herunterladen und installieren." \
            --target "$GITHUB_SHA"

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: optik-falkner-apk
          path: optik-falkner.apk
